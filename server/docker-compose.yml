# ============================================
# 魔饮咖啡内部业务工作台 - 一键启动
# 服务：FastAPI 后端 + React 前端 + Redis + PostgreSQL(pgvector)
# ============================================
version: "3.9"

services:
  # ---------- PostgreSQL + pgvector ----------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mooyin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mooyin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mooyin123}
      POSTGRES_DB: ${POSTGRES_DB:-mooyin_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mooyin} -d ${POSTGRES_DB:-mooyin_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: mooyin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- FastAPI 后端 ----------
  web:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: mooyin_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./agent:/app/agent
      - ./tools:/app/tools
      - ./utils:/app/utils
      - ./memory:/app/memory
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0 --port 8000
      --workers 2 --loop uvloop
      --timeout-keep-alive 30
      --log-level info

  # ---------- React 前端（nginx 托管 + API proxy）----------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: mooyin_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
